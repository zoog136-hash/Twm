name: Cook 523 actors (build-time composited actor pack)
# Cooks the original 523 pack's NPC actors with the game's own runtime
# renderer (zoog136-hash/- tools/cook/cook_actors.gd, official Godot 4.7.2
# editor binary, headless) and publishes the cooked parts to a PRIVATE release
# of this repository: cooked-<source pack>-v1 (or -trial for a limited run).
# Originals are verified here once (bank manifest/tables pins + every SP2
# member SHA-256 through the runtime bank); the game pins each part's SHA-256.
# Nothing original or cooked is ever written to the public game repository.
on:
  workflow_dispatch:
    inputs:
      source_tag: {description: 'original pack release', required: true, default: 'pack-63fb1355'}
      code_ref: {description: 'zoog136-hash/- branch or SHA with tools/cook', required: true, default: 'main'}
      shards: {description: 'parallel shards = cooked parts (each part <= 1.9 GB)', required: true, default: '8'}
      limit: {description: 'actors per shard (0 = all; >0 publishes a -trial release)', required: true, default: '0'}
      lossless: {description: 'RGBA8 everywhere instead of ETC2 opaque pages', required: true, default: 'false'}
      kinds: {description: 'npc,class,transform,effect', required: true, default: 'npc,class,transform,effect'}
  push:
    branches: [cook-actors]
    paths: ['.github/cook-request.json', '.github/workflows/cook-actors.yml']
permissions:
  contents: write
concurrency:
  group: cook-actors
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      source_tag: ${{ steps.p.outputs.source_tag }}
      code_sha: ${{ steps.p.outputs.code_sha }}
      shards: ${{ steps.p.outputs.shards }}
      matrix: ${{ steps.p.outputs.matrix }}
      limit: ${{ steps.p.outputs.limit }}
      lossless: ${{ steps.p.outputs.lossless }}
      kinds: ${{ steps.p.outputs.kinds }}
      cooked_id: ${{ steps.p.outputs.cooked_id }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_SOURCE: ${{ inputs.source_tag }}
          IN_REF: ${{ inputs.code_ref }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_LOSSLESS: ${{ inputs.lossless }}
          IN_KINDS: ${{ inputs.kinds }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            source_tag="$IN_SOURCE"; ref="$IN_REF"; shards="$IN_SHARDS"; limit="$IN_LIMIT"; lossless="$IN_LOSSLESS"; kinds="$IN_KINDS"
          else
            r=.github/cook-request.json
            source_tag=$(jq -r .source_tag $r); ref=$(jq -r .code_ref $r); shards=$(jq -r .shards $r); limit=$(jq -r .limit $r); lossless=$(jq -r .lossless $r); kinds=$(jq -r '.kinds // "npc,class,transform,effect"' $r)
          fi
          code_sha=$(git ls-remote https://github.com/zoog136-hash/- "$ref" | head -1 | cut -f1)
          [ -n "$code_sha" ] || code_sha="$ref"
          cooked_id=$(printf '%s|%s|%s|%s|%s|%s' "$source_tag" "$code_sha" "$shards" "$limit" "$lossless" "$kinds" | sha256sum | cut -d' ' -f1)
          tag="cooked-${source_tag#pack-}-v2"
          [ "$limit" = "0" ] || tag="$tag-trial"
          [ "$lossless" = "true" ] && tag="$tag-lossless"
          matrix=$(python3 -c "import json;print(json.dumps(list(range($shards))))")
          { echo "source_tag=$source_tag"; echo "code_sha=$code_sha"; echo "shards=$shards"; echo "limit=$limit"; echo "lossless=$lossless"; echo "kinds=$kinds"
            echo "cooked_id=$cooked_id"; echo "tag=$tag"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  cook:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/w && sudo chown "$USER" /mnt/w
          df -h / /mnt; nproc; free -g
      - uses: actions/checkout@v4
        with:
          repository: zoog136-hash/-
          ref: ${{ needs.setup.outputs.code_sha }}
          path: code
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            /docs/.gdignore
            !/assets/
            !/external_map_packs/
      - name: Install official Godot 4.7.2 editor
        run: |
          curl -L --fail --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "G=$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Stage and import the game code
        run: |
          set -euo pipefail
          cd code
          python3 tools/ci_core.py --stage "$RUNNER_TEMP/cook-project" --godot "$G" --logs "$RUNNER_TEMP/stage-logs" --prepare-only > /dev/null
          mkdir -p "$RUNNER_TEMP/cook-project/tools/cook"
          cp tools/cook/cook_actors.gd "$RUNNER_TEMP/cook-project/tools/cook/"
          "$G" --headless --path "$RUNNER_TEMP/cook-project" --editor --import --quit > "$RUNNER_TEMP/import.txt" 2>&1 || (tail -40 "$RUNNER_TEMP/import.txt"; exit 1)
      - name: Download and extract the original bank and tables
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd /mnt/w; mkdir -p dl x
          gh release view "${{ needs.setup.outputs.source_tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^twilight523-resources-' > names.txt
          while read -r name; do
            gh release download "${{ needs.setup.outputs.source_tag }}" -R "$GITHUB_REPOSITORY" -p "$name" -D dl
            unzip -q -o "dl/$name" 'source523/bank/*' 'source523/tables/*' 'source523/source523_pack.json' -d x || [ $? -eq 11 ]
            rm -f "dl/$name"
          done < names.txt
          du -sh x/source523/* ; df -h /mnt
      - name: Cook shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          extra=""
          [ "${{ needs.setup.outputs.lossless }}" = "false" ] && extra="--block"
          /usr/bin/time -v "$G" --headless --path "$RUNNER_TEMP/cook-project" --script res://tools/cook/cook_actors.gd -- \
            --pack=/mnt/w/x/source523 --out=/mnt/w/out --shard=${{ matrix.shard }} --shards=${{ needs.setup.outputs.shards }} \
            --limit=${{ needs.setup.outputs.limit }} --kinds=${{ needs.setup.outputs.kinds }} $extra 2>&1 | grep -v '^BOOT_PROGRESS' | tee /mnt/w/cook.txt | tail -200
          grep -q '^COOK_ACTORS_RESULT ' /mnt/w/cook.txt
          ! grep -q 'SCRIPT ERROR' /mnt/w/cook.txt
          du -sh /mnt/w/out
      - name: Upload shard output (work release)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd /mnt/w
          work="${{ needs.setup.outputs.tag }}-work"
          tar -cf "shard-${{ matrix.shard }}.tar" -C out .
          ls -la "shard-${{ matrix.shard }}.tar"
          gh release view "$work" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$work" -R "$GITHUB_REPOSITORY" --target main \
            --title "쿡 작업 중간물 $work (자동 삭제)" --notes "finalize 단계가 조각을 다시 묶은 뒤 지웁니다." || true
          sleep $(( ${{ matrix.shard }} * 3 ))
          gh release upload "$work" -R "$GITHUB_REPOSITORY" --clobber "shard-${{ matrix.shard }}.tar"
  finalize:
    needs: [setup, cook]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/w && sudo chown "$USER" /mnt/w
      - uses: actions/checkout@v4
        with:
          repository: zoog136-hash/-
          ref: ${{ needs.setup.outputs.code_sha }}
          path: code
          persist-credentials: false
          sparse-checkout: tools/cook
      - name: Repack into the fewest parts, manifest, pins
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          tag="${{ needs.setup.outputs.tag }}"; work="$tag-work"
          cd /mnt/w; mkdir -p dl shards m
          gh release download "$work" -R "$GITHUB_REPOSITORY" -p 'shard-*.tar' -D dl
          args=""
          for t in dl/shard-*.tar; do n=$(basename "$t" .tar); mkdir -p "shards/$n"; tar -xf "$t" -C "shards/$n"; rm -f "$t"; args="$args --cooked shards/$n"; cp "shards/$n"/report-*.json m/; done
          cd m
          python3 - "$tag" <<'PY'
          import json, glob, sys
          tag = sys.argv[1]
          reports = [json.load(open(p)) for p in sorted(glob.glob('report-*.json'))]
          totals, failures, kinds, verification = {}, {}, {}, {}
          psnr_min, max_error = 99.0, 0
          for r in reports:
              for k, v in r.get('totals', {}).items():
                  if k == 'etc2_psnr_min': psnr_min = min(psnr_min, v)
                  elif k == 'etc2_max_error': max_error = max(max_error, v)
                  else: totals[k] = totals.get(k, 0) + v
              for k, v in r.get('failure_reasons', {}).items(): failures[k] = failures.get(k, 0) + v
              for k, v in r.get('verification', {}).items():
                  if k == 'etc2_psnr_db_min': verification[k] = min(verification.get(k, 99.0), v)
                  elif k == 'etc2_max_error': verification[k] = max(verification.get(k, 0), v)
                  else: verification[k] = verification.get(k, 0) + v
              for kind, t in r.get('by_kind', {}).items():
                  d = kinds.setdefault(kind, {})
                  for k, v in t.items(): d[k] = d.get(k, 0) + v
          examples = {}
          for r in reports: examples.update(r.get('failure_examples', {}))
          totals['block_psnr_min'] = psnr_min
          totals['block_max_error'] = max_error
          manifest = {'tag': tag, 'cooked_id': '${{ needs.setup.outputs.cooked_id }}', 'source_tag': '${{ needs.setup.outputs.source_tag }}',
                      'code_sha': '${{ needs.setup.outputs.code_sha }}', 'format': reports[0]['format'], 'engine': reports[0]['engine'],
                      'lossless': reports[0].get('lossless'), 'source_pack_id': reports[0].get('source_pack_id'),
                      'bank_manifest_sha256': reports[0].get('bank_manifest_sha256'), 'tables_sha256': reports[0].get('tables_sha256'),
                      'totals': totals, 'by_kind': kinds, 'job_counts': reports[0].get('job_counts'), 'bundles_total': reports[0].get('bundles_total'),
                      'job_filters': reports[0].get('job_filters', {}),
                      'effects': {'rejections': reports[0].get('effect_selection_rejections', {}), 'domain_index': reports[0].get('effect_domain_index', {})},
                      'failure_reasons': dict(sorted(failures.items(), key=lambda kv: -kv[1])), 'failure_examples': examples,
                      'verification': verification, 'shard_msec': [r.get('msec') for r in reports]}
          json.dump(manifest, open('cooked_manifest.json', 'w'), indent=1)
          print(json.dumps(manifest, indent=1)[:6000])
          PY
          cd /mnt/w
          fmt=$(python3 -c "import json;print(json.load(open('m/cooked_manifest.json'))['format'])")
          python3 code/tools/cook/pack_cooked_part.py $args --format "$fmt" --cooked-id ${{ needs.setup.outputs.cooked_id }} \
            --output parts --extra m/cooked_manifest.json > parts.jsonl
          cat parts.jsonl
          python3 - <<'PY'
          import json
          parts = [json.loads(l) for l in open('/mnt/w/parts.jsonl')]
          m = json.load(open('/mnt/w/m/cooked_manifest.json'))
          m['parts'] = parts
          m['part_bytes_total'] = sum(p['bytes'] for p in parts)
          json.dump(m, open('/mnt/w/m/cooked_manifest.json', 'w'), indent=1)
          print('# scripts/boot/cooked_actor_pins.gd')
          print('const COOKED_ID := "%s"' % m['cooked_id'])
          print('const PARTS := {')
          for p in parts: print('\t"%s": [%d, %d, "%s"],' % (p['sha256'], p['part'], p['parts'], p['file']))
          print('}')
          print('total bytes', m['part_bytes_total'])
          PY
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main --title "변환 액터 팩 $tag" \
            --notes "TWILIGHT 변환(쿡) 액터 팩. 원본 팩 ${{ needs.setup.outputs.source_tag }}(같은 내용의 pack-b2162b06도 호환: 뱅크 매니페스트 SHA 기준)에서 게임 코드 ${{ needs.setup.outputs.code_sha }}의 실제 렌더러로 미리 합성. twilight523-cooked-*.zip 조각을 모두 받아 앱 설정 → '추가 리소스(.zip) 설치·업데이트'에서 한꺼번에 선택하세요. 각 조각 SHA-256은 게임 코드(cooked_actor_pins.gd)에 고정되어 설치 때 확인됩니다. cooked_manifest.json은 기록용(설치에 불필요, 1번 조각에도 포함)."
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" parts/twilight523-cooked-*.zip m/cooked_manifest.json
          gh release delete "$work" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
